name: ci

# Standalone build on every push and pull request.
#
# EZminc needs an ITK built with the MINC modules: itkMINCTransformAdapter.h
# lives in ITK's ITKIOTransformMINC module, which is NOT part of a default ITK
# build, so distribution packages (libinsighttoolkit5-dev, InsightToolkit-devel)
# do not ship it. ITK is therefore built from source here with the same module
# selection the minc-toolkit-v2 superbuild uses (ITKIOMINC + ITKIOTransformMINC
# against the system libminc). That build dominates the job time; ccache keeps
# reruns cheap.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEPS: "libminc bicpl"
  DEPS_PREFIX: /opt/bic-mni
  # ITK 5.x: this branch is ported to ITK5 ("Port EZminc to ITK5 and C++17").
  # The superbuild still pairs its ITK 4.14 with the commit before that port.
  ITK_TAG: v5.4.6

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: 'ubuntu:24.04'
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y build-essential cmake git ccache \
            zlib1g-dev libhdf5-dev libnetcdf-dev libgsl-dev libfftw3-dev
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-ci-ubuntu2404-${{ github.sha }}
          restore-keys: |
            ccache-ci-ubuntu2404-
      - name: Build BIC-MNI deps
        run: |
          set -euxo pipefail
          DEP_DIR_FLAGS=""
          for dep in $DEPS; do
            if [ "$dep" = libminc ]; then
              # TEMPORARY (ci validation): libminc with installed-config fixes
              # pending https://github.com/BIC-MNI/libminc/pull/150
              git clone --depth 1 -b ci-modernize "https://github.com/gdevenyi/libminc.git" "dep-$dep"
            else
              git clone --depth 1 -b develop-1.9.18 "https://github.com/BIC-MNI/$dep.git" "dep-$dep" \
                || git clone --depth 1 "https://github.com/BIC-MNI/$dep.git" "dep-$dep"
            fi
            # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
            cmake -B "dep-$dep/build" -S "dep-$dep" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF \
              -DLIBMINC_MINC1_SUPPORT=ON \
              $DEP_DIR_FLAGS
            cmake --build "dep-$dep/build" -j"$(nproc)"
            cmake --install "dep-$dep/build"
            name=$(echo "$dep" | tr '[:lower:]-' '[:upper:]_')
            cfg=$(find "$DEPS_PREFIX" -name "${name}Config.cmake" -print -quit)
            if [ -n "$cfg" ]; then
              DEP_DIR_FLAGS="${DEP_DIR_FLAGS} -D${name}_DIR=$(dirname "$cfg")"
            fi
          done
          echo "DEP_DIR_FLAGS=$DEP_DIR_FLAGS" >> "$GITHUB_ENV"
      - name: Build ITK with the MINC modules
        run: |
          set -euxo pipefail
          git clone --depth 1 -b "$ITK_TAG" https://github.com/InsightSoftwareConsortium/ITK.git itk-src
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          cmake -B itk-build -S itk-src \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DModule_ITKIOMINC=ON \
            -DModule_ITKIOTransformMINC=ON \
            -DModule_ITKReview=ON \
            -DITK_USE_SYSTEM_MINC=ON \
            -DITK_USE_SYSTEM_HDF5=ON \
            -DITK_USE_SYSTEM_ZLIB=ON \
            $DEP_DIR_FLAGS
          cmake --build itk-build -j"$(nproc)"
          cmake --install itk-build
          echo "ITK_DIR=$(dirname "$(find "$DEPS_PREFIX" -name ITKConfig.cmake -print -quit)")" >> "$GITHUB_ENV"
      - name: Configure + build
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP:-/tmp}/ci-install" \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DITK_DIR="$ITK_DIR" \
            -DBUILD_TESTING=OFF \
            $DEP_DIR_FLAGS
          cmake --build build -j"$(nproc)"
          cmake --install build

  fedora:
    runs-on: ubuntu-latest
    container: 'fedora:44'
    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 3G
      QA_RPATHS: '0x000f'
    steps:
      - name: Install build deps
        run: |
          dnf install -y gcc gcc-c++ cmake make git ccache which file \
            zlib-devel hdf5-devel netcdf-devel gsl-devel fftw-devel
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-ci-fedora44-${{ github.sha }}
          restore-keys: |
            ccache-ci-fedora44-
      - name: Build BIC-MNI deps
        run: |
          set -euxo pipefail
          DEP_DIR_FLAGS=""
          for dep in $DEPS; do
            if [ "$dep" = libminc ]; then
              # TEMPORARY (ci validation): libminc with installed-config fixes
              # pending https://github.com/BIC-MNI/libminc/pull/150
              git clone --depth 1 -b ci-modernize "https://github.com/gdevenyi/libminc.git" "dep-$dep"
            else
              git clone --depth 1 -b develop-1.9.18 "https://github.com/BIC-MNI/$dep.git" "dep-$dep" \
                || git clone --depth 1 "https://github.com/BIC-MNI/$dep.git" "dep-$dep"
            fi
            # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
            cmake -B "dep-$dep/build" -S "dep-$dep" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF \
              -DLIBMINC_MINC1_SUPPORT=ON \
              $DEP_DIR_FLAGS
            cmake --build "dep-$dep/build" -j"$(nproc)"
            cmake --install "dep-$dep/build"
            name=$(echo "$dep" | tr '[:lower:]-' '[:upper:]_')
            cfg=$(find "$DEPS_PREFIX" -name "${name}Config.cmake" -print -quit)
            if [ -n "$cfg" ]; then
              DEP_DIR_FLAGS="${DEP_DIR_FLAGS} -D${name}_DIR=$(dirname "$cfg")"
            fi
          done
          echo "DEP_DIR_FLAGS=$DEP_DIR_FLAGS" >> "$GITHUB_ENV"
      - name: Build ITK with the MINC modules
        run: |
          set -euxo pipefail
          git clone --depth 1 -b "$ITK_TAG" https://github.com/InsightSoftwareConsortium/ITK.git itk-src
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          cmake -B itk-build -S itk-src \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DModule_ITKIOMINC=ON \
            -DModule_ITKIOTransformMINC=ON \
            -DModule_ITKReview=ON \
            -DITK_USE_SYSTEM_MINC=ON \
            -DITK_USE_SYSTEM_HDF5=ON \
            -DITK_USE_SYSTEM_ZLIB=ON \
            $DEP_DIR_FLAGS
          cmake --build itk-build -j"$(nproc)"
          cmake --install itk-build
          echo "ITK_DIR=$(dirname "$(find "$DEPS_PREFIX" -name ITKConfig.cmake -print -quit)")" >> "$GITHUB_ENV"
      - name: Configure + build
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP:-/tmp}/ci-install" \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DITK_DIR="$ITK_DIR" \
            -DBUILD_TESTING=OFF \
            $DEP_DIR_FLAGS
          cmake --build build -j"$(nproc)"
          cmake --install build

  macos:
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache hdf5 netcdf gsl fftw
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-macos-${{ github.sha }}
          restore-keys: |
            ccache-ci-macos-
      - name: Build BIC-MNI deps
        run: |
          set -euxo pipefail
          DEP_DIR_FLAGS=""
          for dep in $DEPS; do
            if [ "$dep" = libminc ]; then
              # TEMPORARY (ci validation): libminc with installed-config fixes
              # pending https://github.com/BIC-MNI/libminc/pull/150
              git clone --depth 1 -b ci-modernize "https://github.com/gdevenyi/libminc.git" "dep-$dep"
            else
              git clone --depth 1 -b develop-1.9.18 "https://github.com/BIC-MNI/$dep.git" "dep-$dep" \
                || git clone --depth 1 "https://github.com/BIC-MNI/$dep.git" "dep-$dep"
            fi
            # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
            cmake -B "dep-$dep/build" -S "dep-$dep" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF \
              -DLIBMINC_MINC1_SUPPORT=ON \
              $DEP_DIR_FLAGS
            cmake --build "dep-$dep/build" -j"$(sysctl -n hw.ncpu)"
            sudo cmake --install "dep-$dep/build"
            name=$(echo "$dep" | tr '[:lower:]-' '[:upper:]_')
            cfg=$(find "$DEPS_PREFIX" -name "${name}Config.cmake" -print -quit)
            if [ -n "$cfg" ]; then
              DEP_DIR_FLAGS="${DEP_DIR_FLAGS} -D${name}_DIR=$(dirname "$cfg")"
            fi
          done
          echo "DEP_DIR_FLAGS=$DEP_DIR_FLAGS" >> "$GITHUB_ENV"
      - name: Build ITK with the MINC modules
        run: |
          set -euxo pipefail
          git clone --depth 1 -b "$ITK_TAG" https://github.com/InsightSoftwareConsortium/ITK.git itk-src
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          sudo cmake -B itk-build -S itk-src \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DModule_ITKIOMINC=ON \
            -DModule_ITKIOTransformMINC=ON \
            -DModule_ITKReview=ON \
            -DITK_USE_SYSTEM_MINC=ON \
            -DITK_USE_SYSTEM_HDF5=ON \
            -DITK_USE_SYSTEM_ZLIB=ON \
            $DEP_DIR_FLAGS
          sudo cmake --build itk-build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install itk-build
          echo "ITK_DIR=$(dirname "$(find "$DEPS_PREFIX" -name ITKConfig.cmake -print -quit)")" >> "$GITHUB_ENV"
      - name: Configure + build
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2086 # DEP_DIR_FLAGS is a list of -D flags
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP:-/tmp}/ci-install" \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DITK_DIR="$ITK_DIR" \
            -DBUILD_TESTING=OFF \
            $DEP_DIR_FLAGS
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cmake --install build
